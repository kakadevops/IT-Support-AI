<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT-Support AI</title>
<style>
:root{--bg:#faf9f5;--side:#f2f0e8;--card:#fff;--tx:#1f1e1d;--mut:#75736b;--ac:#2f7df6;--bd:#e6e3d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--side:#1f1e1d;--card:#30302e;--tx:#faf9f5;--mut:#a3a199;--ac:#4da3ff;--bd:#3d3d3a}}
:root[data-theme="dark"]{--bg:#262624;--side:#1f1e1d;--card:#30302e;--tx:#faf9f5;--mut:#a3a199;--ac:#4da3ff;--bd:#3d3d3a}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex}
aside{width:260px;background:var(--side);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font:600 19px Georgia,"Times New Roman",serif;padding:6px 10px 12px}
.lg{border-radius:50%;background:var(--logo) center/cover no-repeat;flex-shrink:0}
.brand i{color:var(--ac);font-style:normal}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:8px;font:inherit;font-size:14.5px;cursor:pointer}
aside button:hover,aside button.on{background:color-mix(in srgb,var(--tx) 8%,transparent)}
aside .new{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600;margin-bottom:10px}
aside small{color:var(--mut);padding:14px 10px 4px;font-size:12px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:600}
.top button{background:none;border:0;font-size:22px;color:var(--tx);cursor:pointer}
#view{flex:1;overflow-y:auto;padding:24px 20px}
.wrap{max-width:720px;margin:0 auto}
#foot{padding:0 20px 16px}
h2{font:500 26px Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.hero{text-align:center;margin:6vh 0 22px}
.hero h1{font:400 34px Georgia,"Times New Roman",serif;margin:0}
.hero h1 i{color:var(--ac);font-style:normal}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:10px 10px 10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);max-width:720px;margin:0 auto}
.box:focus-within{border-color:var(--ac)}
.box textarea{flex:1;border:0;outline:0;background:none;color:var(--tx);font:inherit;resize:none;max-height:160px;padding:6px 0}
.go{width:36px;height:36px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.go:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto;max-width:720px}
.chips button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button:hover{background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:720px;margin:26px auto 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:15px}
.card small{color:var(--mut)}
.msg{margin:0 0 22px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 15px;width:fit-content;max-width:85%;margin-left:auto}
.msg.a{position:relative;padding-left:34px}
.msg.a::before{content:"";position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--logo) center/cover no-repeat}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
ol{margin:10px 0 0;padding-left:20px}
li{margin:4px 0}
.tag{font-size:12px;color:var(--mut);margin-left:8px;font-weight:400}
.sr{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;margin-bottom:16px}
.note{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
@media (max-width:760px){
 body{display:block}
 aside{display:none;position:fixed;top:0;left:0;bottom:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 aside.open{display:flex;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
 body{display:flex;flex-direction:column}
 .top{display:flex}
 .hero h1{font-size:28px}
}

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var br=el("div","brand");br.innerHTML='<span class="lg" style="width:36px;height:36px"></span>IT-Support AI';nav.appendChild(br);
var nw=el("button","new","＋ New chat");nw.onclick=function(){hist=[];go("ai")};nav.appendChild(nw);
nav.appendChild(el("small","","MENU"));
NAV.forEach(function(n){var b=el("button","",n[1]+"  "+n[2]);b.dataset.id=n[0];b.onclick=function(){go(n[0])};nav.appendChild(b)});
document.getElementById("mb").onclick=function(){nav.classList.toggle("open")};
function box(cb){
 var w=el("div","box"),ta=el("textarea");ta.rows=1;ta.placeholder="Describe your IT problem…";
 var b=el("button","go","↑");b.setAttribute("aria-label","Send");
 function fire(){var t=ta.value.trim();if(t){ta.value="";ta.style.height="auto";cb(t)}}
 ta.oninput=function(){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"};
 ta.onkeydown=function(e){if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();fire()}};
 b.onclick=fire;w.appendChild(ta);w.appendChild(b);w.btn=b;return w}
function ask(t){pending=t;go("ai")}
function issue(t,steps,tag){var d=el("details"),s=el("summary","",t);if(tag)s.appendChild(el("span","tag",tag));d.appendChild(s);var o=el("ol");steps.forEach(function(x){o.appendChild(el("li","",x))});d.appendChild(o);return d}
function go(id){
 cur=id;nav.classList.remove("open");view.innerHTML="";foot.innerHTML="";
 Array.prototype.forEach.call(nav.querySelectorAll("button[data-id]"),function(b){b.classList.toggle("on",b.dataset.id==id)});
 var n=NAV.filter(function(x){return x[0]==id})[0];
 if(id=="dash")dash();
 else if(id=="ai")chat();
 else{
  var w=el("div","wrap");w.appendChild(el("h2","",n[1]+" "+n[2]));w.appendChild(el("p","sub",n[3]));view.appendChild(w);
  if(id=="kb")kb(w);else D[id].forEach(function(i){w.appendChild(issue(i[0],i[1]))})}
 view.scrollTop=0}
function dash(){
 var h=el("div","hero");h.innerHTML='<div class="lg" style="width:124px;height:124px;margin:0 auto 14px"></div><h1>How can I help with IT today?</h1><p class="sub" style="letter-spacing:.2em;font-size:12px;margin:8px 0 0">SOLVE • SUPPORT • SIMPLIFY</p>';view.appendChild(h);
 view.appendChild(box(ask));
 var c=el("div","chips");CH.forEach(function(t){var b=el("button","",t);b.onclick=function(){ask(t)};c.appendChild(b)});view.appendChild(c);
 var g=el("div","grid");
 NAV.slice(2).forEach(function(n){var k=el("button","card");k.appendChild(el("span","",n[1]));k.appendChild(el("b","",n[2]));k.appendChild(el("small","",n[3]));k.onclick=function(){go(n[0])};g.appendChild(k)});
 view.appendChild(g)}
function kb(w){
 var q=el("input","sr");q.placeholder="Search guides (e.g. printer, password, dns)…";w.appendChild(q);
 var bx=el("div");w.appendChild(bx);
 var all=[];NAV.slice(2,8).forEach(function(n){D[n[0]].forEach(function(i){all.push([n[2].replace(" Troubleshooting","").replace("Account & Password Issues","Account"),i[0],i[1]])})});
 KB.forEach(function(k){all.push([k[0],k[1],k[2]])});
 function draw(){bx.innerHTML="";var s=q.value.toLowerCase(),n=0;all.forEach(function(a){if((a[0]+a[1]+a[2].join(" ")).toLowerCase().indexOf(s)>-1){n++;bx.appendChild(issue(a[1],a[2],a[0]))}});if(!n)bx.appendChild(el("p","sub","No guides found. Try the AI Assistant."))}
 q.oninput=draw;draw()}
function chat(){
 var w=el("div","wrap");view.appendChild(w);
 var bx=box(function(t){send(t)});foot.appendChild(bx);foot.appendChild(el("div","note","AI can make mistakes. For security or risky changes, contact your IT admin."));
 function add(c,t){var m=el("div","msg "+c,t);w.appendChild(m);view.scrollTop=view.scrollHeight;return m}
 if(!hist.length)add("a","Hi! I'm your IT Support AI. Tell me what's wrong — device, error message, and what you already tried.");
 hist.forEach(function(h){add(h.role=="user"?"u":"a",h.content)});
 var busy=false;
 function send(text){
  if(busy)return;busy=true;bx.btn.disabled=true;
  add("u",text);hist.push({role:"user",content:text});
  var out=add("a","Thinking…");
  (async function(){
   try{
    var sample=await claude.use("sample");
    if(!sample){out.textContent="AI is not available in this view. Please use the troubleshooting sections from the menu.";hist.pop();return}
    var pre="You are an IT support assistant. Give clear, numbered, step-by-step fixes for Windows/network/printer/Wi-Fi/account issues. Be concise, ask one clarifying question if needed, and tell the user to contact their IT admin for anything risky or security-related.\n\n";
    var turns=hist.map(function(h,i){return{role:h.role,content:(i==0?pre:"")+h.content}});
    var r=await sample(turns,{cache:false,onText:function(o){out.textContent=o.text;view.scrollTop=view.scrollHeight}});
    out.textContent=r.text;hist.push({role:"assistant",content:r.text})
   }catch(e){out.textContent="Sorry, something went wrong. Please try again.";hist.pop()}
   finally{busy=false;bx.btn.disabled=false}
  })()}
 if(pending){var p=pending;pending=null;send(p)}}
go("dash");
</script>
</body>
</html>
